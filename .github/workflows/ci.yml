name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-dune:
    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - 5.4.x
          - 5.3.x
          - 5.2.x
          - 5.1.x
          - 5.0.x
          - 4.14.x
          - 4.13.x
          - 4.12.x
          - 4.11.x
          - ocaml-base-compiler.4.10.2
          - ocaml-base-compiler.4.09.1
          - ocaml-base-compiler.4.08.1
          - ocaml-base-compiler.4.07.1
          - ocaml-base-compiler.4.06.1
          - ocaml-base-compiler.4.05.0
        test:
          - true

        include:
          - os: macos-latest
            ocaml-compiler: 4.14.x
            test: true
          - os: macos-latest
            ocaml-compiler: 5.0.0
            test: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          opam-repositories: |
            default: git+https://github.com/ocaml/opam-repository.git
            archive: git+https://github.com/ocaml/opam-repository-archive.git
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install dependencies
        run: opam install . --deps-only

      - name: Install test dependencies
        if: ${{ matrix.test }}
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build @install

      - name: Test
        if: ${{ matrix.test }}
        run: opam exec -- dune runtest
